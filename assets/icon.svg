<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3ff"/>
      <stop offset="0.55" stop-color="#a9c8ff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#3a56c8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 元素1: wallpaper = 背景 -->
  <rect x="24" y="24" width="976" height="976" rx="230" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="230" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"/>

  <!-- 元素2: weather = 上 (太阳 + 云) -->
  <g stroke="#ffd76a" stroke-width="22" stroke-linecap="round">
    <line x1="320" y1="130" x2="320" y2="166"/>
    <line x1="176" y1="272" x2="212" y2="272"/>
    <line x1="428" y1="272" x2="464" y2="272"/>
    <line x1="218" y1="170" x2="243" y2="195"/>
    <line x1="397" y1="349" x2="422" y2="374"/>
    <line x1="422" y1="170" x2="397" y2="195"/>
    <line x1="243" y1="349" x2="218" y2="374"/>
  </g>
  <circle cx="320" cy="272" r="78" fill="#ffd76a"/>

  <g filter="url(#soft)">
    <circle cx="660" cy="262" r="58" fill="#ffffff"/>
    <circle cx="742" cy="240" r="74" fill="#ffffff"/>
    <circle cx="824" cy="268" r="54" fill="#ffffff"/>
    <rect x="660" y="248" width="164" height="72" rx="36" fill="#ffffff"/>
  </g>

  <!-- 元素3: deepseek 大肥鱼(鲸) = 下 -->
  <g filter="url(#soft)">
    <!-- 尾鳍 -->
    <ellipse cx="792" cy="618" rx="58" ry="30" fill="#4d6bfe" transform="rotate(-38 792 618)"/>
    <ellipse cx="808" cy="752" rx="58" ry="30" fill="#4d6bfe" transform="rotate(38 808 752)"/>
    <path d="M 690 660 Q 780 640 798 622 Q 812 660 792 690 Q 812 715 812 748 Q 758 748 715 720 Q 690 700 690 660 Z" fill="#4d6bfe"/>
    <!-- 肥身体 -->
    <ellipse cx="500" cy="700" rx="225" ry="122" fill="#4d6bfe"/>
    <!-- 肚皮 -->
    <ellipse cx="470" cy="762" rx="165" ry="52" fill="#c7d6ff"/>
    <!-- 胸鳍 -->
    <ellipse cx="540" cy="796" rx="62" ry="26" fill="#3a58e8" transform="rotate(14 540 796)"/>
    <!-- 眼睛 + 微笑 -->
    <circle cx="392" cy="668" r="15" fill="#16255f"/>
    <circle cx="397" cy="663" r="5" fill="#ffffff"/>
    <path d="M 322 712 Q 366 748 418 734" fill="none" stroke="#16255f" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
