name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller & pywebview
        run: pip install pyinstaller pywebview

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name WeatherDynamicWallpaper
          --icon assets/icon.ico
          --add-data "weatherwall/web/index.html;weatherwall/web"
          --add-data "weatherwall/web/style.css;weatherwall/web"
          --add-data "weatherwall/web/app.js;weatherwall/web"
          --add-data "weatherwall/web/i18n.js;weatherwall/web"
          --add-data "weatherwall/seed/island.png;weatherwall/seed"
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          winmain.py

      - name: Smoke test (headless serve mode)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WeatherDynamicWallpaper.exe" -ArgumentList "serve" -PassThru
          Start-Sleep -Seconds 8
          try {
            $r = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 5
            if ($r.version) { Write-Host "OK: serve mode, version $($r.version), platform $($r.platform)" }
            else { Write-Error "status API unexpected"; exit 1 }
          } finally { Stop-Process -Id $p.Id -Force }

      - name: Smoke test (GUI mode default)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WeatherDynamicWallpaper.exe" -PassThru
          $ok = $false
          foreach ($i in 1..15) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 3
              if ($r.version) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($ok) { Write-Host "OK: gui mode service up" } else { Write-Error "gui mode service not reachable"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherDynamicWallpaper-windows
          path: dist/WeatherDynamicWallpaper.exe

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WeatherDynamicWallpaper.exe
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          body: |
            **WeatherDynamicWallpaper Windows 测试版**

            下载 WeatherDynamicWallpaper.exe 双击运行：自动弹出设置窗口（内置 WebView2），
            后台服务同时启动。关闭窗口即退出。

            注意：exe 未签名，Windows SmartScreen 可能拦截 —— 点击「更多信息 → 仍要运行」。
