name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller & pywebview
        run: pip install pyinstaller pywebview

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build app + DMG
        run: ./build-mac.sh dmg

      - name: Smoke test (headless serve mode)
        run: |
          ./dist/WeatherDynamicWallpaper.app/Contents/MacOS/WeatherDynamicWallpaper serve &
          PID=$!
          OK=0
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf --max-time 3 http://127.0.0.1:8765/api/status | grep -q version; then OK=1; break; fi
          done
          kill $PID 2>/dev/null || true
          if [ "$OK" != "1" ]; then echo "serve mode not reachable"; exit 1; fi
          echo "OK: serve mode up"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherDynamicWallpaper-macos
          path: dist/*.dmg

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          body: |
            **WeatherDynamicWallpaper macOS 测试版**

            打开 DMG，把 WeatherDynamicWallpaper 拖入「应用程序」后启动：设置窗口随即弹出，
            后台服务同时启动。首次切换壁纸需允许「自动化-系统事件」权限。
            应用未签名：新机器首次打开请 右键 → 打开。
